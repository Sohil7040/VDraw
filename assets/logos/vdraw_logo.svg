<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="50%" stop-color="#1E1B4B"/>
            <stop offset="100%" stop-color="#090D16"/>
        </linearGradient>

        <!-- Left Wing Primary Gradient -->
        <linearGradient id="leftWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="45%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>

        <!-- Left Wing Specular / Light Edge -->
        <linearGradient id="leftWingBevel" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1"/>
        </linearGradient>

        <!-- Right Wing Primary Gradient -->
        <linearGradient id="rightWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E11D48"/>
            <stop offset="40%" stop-color="#F43F5E"/>
            <stop offset="80%" stop-color="#FB923C"/>
            <stop offset="100%" stop-color="#FBBF24"/>
        </linearGradient>

        <!-- Apex Glow -->
        <radialGradient id="apexGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
        </radialGradient>

        <!-- Shadow Filter -->
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
        </filter>

        <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Outer Squircle Container with Shadow -->
    <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
    <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.25"/>

    <!-- Subtle CAD Precision Grid & Polar Guides -->
    <g opacity="0.18">
        <circle cx="256" cy="260" r="170" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 6"/>
        <circle cx="256" cy="260" r="105" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
        <line x1="86" y1="260" x2="426" y2="260" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4"/>
        <line x1="256" y1="90" x2="256" y2="430" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4"/>
        <!-- 45-degree cross lines -->
        <line x1="135" y1="139" x2="377" y2="381" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="3 5"/>
        <line x1="377" y1="139" x2="135" y2="381" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="3 5"/>
    </g>

    <!-- Apex Background Soft Glow -->
    <circle cx="256" cy="390" r="80" fill="url(#apexGlow)"/>

    <!-- Main V Glyph Group with Shadow -->
    <g filter="url(#glyphShadow)">
        <!-- Left Wing (Cyan to Blue Precision Beam) -->
        <path d="M 108 120 L 196 120 L 256 365 L 208 395 L 90 148 Z" fill="url(#leftWingGrad)"/>
        
        <!-- Left Wing Inner Specular Bevel -->
        <path d="M 108 120 L 126 120 L 222 378 L 208 395 Z" fill="url(#leftWingBevel)"/>

        <!-- Right Wing (Vibrant Coral/Orange to Gold Flare, Overlapping at Apex) -->
        <path d="M 200 380 L 256 414 L 404 120 L 320 120 L 234 320 Z" fill="url(#rightWingGrad)"/>

        <!-- Center 3D Fold Intersecting Facet -->
        <path d="M 208 395 L 256 414 L 256 365 Z" fill="#0C4A6E" opacity="0.65"/>
    </g>

    <!-- Vector Node Gizmos & Handles (CorelDRAW / CAD Aesthetic) -->
    <!-- Top-Left Anchor -->
    <circle cx="108" cy="120" r="7" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>

    <!-- Top-Right Anchor with Bézier Tangent Handle -->
    <line x1="360" y1="80" x2="444" y2="160" stroke="#FBBF24" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="360" cy="80" r="5" fill="#FBBF24"/>
    <circle cx="444" cy="160" r="5" fill="#FBBF24"/>
    <rect x="395" y="111" width="18" height="18" rx="2" fill="#FFFFFF" stroke="#F43F5E" stroke-width="2.5"/>

    <!-- Bottom Apex Master Node -->
    <rect x="246" y="404" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#38BDF8" stroke-width="3"/>
    <rect x="251" y="409" width="10" height="10" rx="1" fill="#0284C7"/>
</svg>
