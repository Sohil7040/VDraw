[workspace]
resolver = "2"
members = [
    "crates/core-geom",
    "crates/core-doc",
    "crates/core-snap",
    "crates/core-boolean",
    "crates/core-tools",
    "crates/core-cam",
    "crates/io",
    "crates/app",
]

[workspace.dependencies]
# UI
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
egui_extras = "0.31"
# Geometry
kurbo = "0.11"
tiny-skia = "0.11"
clipper2-rs = "0.3.0"
ttf-parser = "0.25.1"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging
log = "0.4"
env_logger = "0.11"
# Error handling
thiserror = "2"
anyhow = "1"
# Spatial index
rstar = "0.12"
bitflags = "2"
# Testing & Benchmarking (dev-dependencies only in workspace crates)
proptest = "1.6"
criterion = "0.5"
insta = "1"
approx = "0.5"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
